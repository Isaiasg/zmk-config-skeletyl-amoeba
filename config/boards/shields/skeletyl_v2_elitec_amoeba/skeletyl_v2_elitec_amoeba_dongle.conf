CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

# NVS (Non-Volatile Storage) settings for Bluetooth identity and bonding
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

# BLE split transport (peripheral communication)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6

# Battery reporting from halves to dongle
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# USB serial logging - ZMK level only (BT_LOG_LEVEL_DBG floods the buffer
# and drops the ZMK disconnect/connect messages we actually need to see)
CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_LOG_LEVEL_DBG=y
