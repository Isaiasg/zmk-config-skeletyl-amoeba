# Deep sleep after 15 minutes of inactivity
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Split peripheral role — must explicitly disable USB HID since the
# nice_nano board defconfig sets CONFIG_ZMK_USB=y, which conflicts with
# ZMK_USB's Kconfig dependency: depends on (!ZMK_SPLIT || SPLIT_ROLE_CENTRAL)
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_USB=n

# Enable USB CDC-ACM logging for diagnostics (also prevents USB stack
# from crashing due to having no class driver while USB hardware is active)
CONFIG_ZMK_USB_LOGGING=y
